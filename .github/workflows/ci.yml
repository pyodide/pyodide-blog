name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Hugo build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUGO_VERSION: "0.145.0"
    steps:
      - name: Check out repository and theme
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Hugo
        working-directory: ${{ runner.temp }}
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 --output "$archive" "$release/$archive"
          curl --fail --location --retry 3 --output checksums.txt "$release/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build site
        run: hugo
