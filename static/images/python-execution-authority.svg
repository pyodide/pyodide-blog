<svg xmlns="http://www.w3.org/2000/svg" width="360" height="366" viewBox="0 0 360 366" role="img" aria-labelledby="title description">
  <title id="title">Interfaces used by the three lab environments</title>
  <desc id="description">Native CPython child to ordinary host authority. Browser worker to MEMFS and deliberately exposed JavaScript. Monty interpreter to an explicitly provided host callback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#303030"/>
    </marker>
  </defs>
  <g fill="#fff" stroke="#777" stroke-width="1">
    <rect x="8" y="12" width="344" height="106" rx="4"/>
    <rect x="8" y="130" width="344" height="106" rx="4"/>
    <rect x="8" y="248" width="344" height="106" rx="4"/>
  </g>
  <g fill="none" stroke="#303030" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 145 65 H 175"/>
    <path d="M 145 183 H 175"/>
    <path d="M 145 301 H 175"/>
  </g>
  <g fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">
    <text x="79" y="59">Native CPython</text>
    <text x="79" y="82">child</text>
    <text x="263" y="59">Ordinary host</text>
    <text x="263" y="82">authority</text>
    <text x="79" y="177">Browser</text>
    <text x="79" y="200">worker</text>
    <text x="263" y="165">MEMFS and</text>
    <text x="263" y="188">deliberately exposed</text>
    <text x="263" y="211">JavaScript</text>
    <text x="79" y="295">Monty</text>
    <text x="79" y="318">interpreter</text>
    <text x="263" y="295">Explicitly provided</text>
    <text x="263" y="318">host callback</text>
  </g>
</svg>
